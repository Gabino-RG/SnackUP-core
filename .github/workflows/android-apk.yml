name: Android APK Sprint 10

on:
  push:
    branches:
      - 'codex/**'
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    # Keep the host stable while ubuntu-latest moves to newer releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.32.4 from its official repository
        run: |
          git clone --depth 1 --branch 3.32.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"

      - name: Prepare Flutter and Android SDK
        run: |
          flutter config --no-analytics
          flutter --version
          snackup_sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$snackup_sdkmanager" ]]; then
            snackup_sdkmanager="$(command -v sdkmanager)"
          fi
          # GitHub's hosted Android SDK already includes accepted licenses.
          "$snackup_sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973'
          flutter precache --android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run isolated Flutter tests
        run: flutter test --reporter expanded

      - name: Build the academic Android APK
        # The project signs this academic build with the Android debug key.
        # This workflow does not deploy Firebase or publish a store release.
        run: flutter build apk --release --build-name=1.0.0 --build-number=10

      - name: Verify the APK signature and prepare its checksum
        run: |
          snackup_apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$snackup_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$snackup_apk"
          mkdir -p build/entrega
          cp "$snackup_apk" 'build/entrega/SnackUP-1.0.0+10.apk'
          (
            cd build/entrega
            sha256sum 'SnackUP-1.0.0+10.apk' > SHA256SUMS.txt
          )
          printf 'Commit: %s\nVersion: 1.0.0+10\nFlutter: 3.32.4\nSignature: academic debug key\n' \
            "$GITHUB_SHA" > build/entrega/BUILD-INFO.txt

      - name: Upload the APK and SHA256
        uses: actions/upload-artifact@v7
        with:
          name: SnackUP-Android-1.0.0-build10-${{ github.run_number }}
          path: |
            build/entrega/SnackUP-1.0.0+10.apk
            build/entrega/SHA256SUMS.txt
            build/entrega/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
