name: Backend REST SQL

on:
  workflow_dispatch:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: snackup_ci
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: snackup_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U snackup_ci -d snackup_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SNACKUP_ENVIRONMENT: test
      SNACKUP_SECRET_KEY: isolated-ci-key-not-a-production-secret-2026
      SNACKUP_DATABASE_URL: postgresql+psycopg://snackup_ci:isolated-ci-password@localhost:5432/snackup_ci
      SNACKUP_TEST_DATABASE_URL: postgresql+psycopg://snackup_ci:isolated-ci-password@localhost:5432/snackup_ci
      SNACKUP_REDIS_URL: ''
      SNACKUP_TEST_REDIS_URL: redis://localhost:6379/1
      SNACKUP_PUBLIC_ORIGIN: http://localhost:8000
      SNACKUP_ADMIN_EMAIL_DOMAINS: staff.example.edu
      SNACKUP_STUDENT_EMAIL_DOMAINS: students.example.edu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install exact dependency lock
        run: python -m pip install -r requirements.lock
      - name: Static checks
        run: python -m ruff check snackup tests deploy load
      - name: Upgrade PostgreSQL schema and check model drift
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Full suite against isolated PostgreSQL schemas and Redis
        run: python -m pytest -q --junitxml=reports/pytest-postgres.xml
      - name: Build non-root API and TLS proxy images
        run: |
          docker build --tag snackup-backend:ci .
          docker build --file deploy/proxy.Dockerfile --tag snackup-proxy:ci .
          test "$(docker inspect --format '{{.Config.User}}' snackup-backend:ci)" = '10001:10001'
          test "$(docker inspect --format '{{.Config.User}}' snackup-proxy:ci)" = '10001:10001'
      - name: Validate proxy configuration
        run: |
          docker run --rm -e SNACKUP_DOMAIN=snackup.example.test -e TLS_ACME_EMAIL=qa@example.test snackup-proxy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Boot isolated Compose stack with application SQL role
        env:
          SNACKUP_DOMAIN: snackup.example.test
          TLS_ACME_EMAIL: qa@example.test
          SNACKUP_INSTITUTION_ID: ci-institution
          SNACKUP_INSTITUTION_NAME: Isolated CI institution
          SNACKUP_CAFETERIA_ID: ci-cafeteria
          SNACKUP_CAFETERIA_NAME: Isolated CI cafeteria
          POSTGRES_DB: snackup_smoke
          POSTGRES_USER: postgres_admin
          POSTGRES_PASSWORD: isolated-ci-admin-password
          SNACKUP_DB_USER: snackup
          SNACKUP_DB_PASSWORD: isolated-ci-app-password
          REDIS_PASSWORD: isolated-ci-redis-password
        run: |
          trap 'docker compose -p snackup-smoke down --volumes --remove-orphans' EXIT
          docker tag snackup-backend:ci snackup-backend:local
          docker compose -p snackup-smoke config --quiet
          docker compose -p snackup-smoke up -d db redis
          docker compose -p snackup-smoke run --rm migrate
          docker compose -p snackup-smoke up -d --wait --wait-timeout 120 api
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnackUP-Backend-Tests
          path: |
            backend/reports/pytest*.xml
            backend/reports/contract-responses.json
          if-no-files-found: ignore
          retention-days: 30
