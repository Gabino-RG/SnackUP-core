name: Flutter CI

on:
  push:
    branches: [develop, test/api-aaa-sonarqube]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: snackup-dependency-lock
          path: app/pubspec.lock
          if-no-files-found: error
          retention-days: 14
        
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Build integrated application
        run: flutter build web --no-web-resources-cdn --target lib/main.dart

      - name: Preserve integrated web build
        uses: actions/upload-artifact@v4
        with:
          name: snackup-integrated-web
          path: app/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Build local editable catalog
        run: flutter build web --no-web-resources-cdn --target lib/main_catalog_local.dart --output build/catalog-local

      - name: Preserve editable catalog
        uses: actions/upload-artifact@v4
        with:
          name: snackup-catalogo-local
          path: app/build/catalog-local
          if-no-files-found: error
          retention-days: 14
