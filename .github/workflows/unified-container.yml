name: Contenedor unico SnackUP
on:
  workflow_dispatch:
  push:
    branches: [codex/integracion-local-completa]
    paths: ['backend/**', 'lib/**', 'assets/**', 'web/**', 'pubspec.*', 'app/**', 'deploy/check_web_build.py', 'tools/integrated_server.py', '.github/workflows/unified-container.yml']
permissions:
  contents: read
concurrency:
  group: unified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: snackup_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['127.0.0.1:6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      SNACKUP_ENVIRONMENT: test
      SNACKUP_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/snackup_test
      SNACKUP_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and the deployment proxy
        run: |
          python -m pip install -r requirements.lock
          container=$(docker create caddy:2.11.7-alpine)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
          echo "CADDY_BIN=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - name: Run the complete suite against disposable services
        run: |
          export SNACKUP_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          python -m pytest -q --tb=short --junitxml=reports/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/reports/backend.xml
          retention-days: 14
  unified:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      COMPOSE_PROJECT_NAME: snackup-unified-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: ${{ github.workspace }}/backend/compose.unified.yaml:${{ github.workspace }}/backend/deploy/unified/compose.ci.yaml
      SNACKUP_DOMAIN: snackup.example.test
      TLS_ACME_EMAIL: ci@snackup.example.test
      POSTGRES_DB: snackup_unified_ci
      POSTGRES_USER: postgres_ci
      SNACKUP_DB_USER: snackup_ci
      SNACKUP_INSTITUTION_ID: ci-institution
      SNACKUP_INSTITUTION_NAME: Synthetic CI Institution
      SNACKUP_CAFETERIA_ID: ci-cafeteria
      SNACKUP_CAFETERIA_NAME: Synthetic CI Cafeteria
      SNACKUP_ADMIN_EMAIL_DOMAINS: snackup.example.test
      SNACKUP_STUDENT_EMAIL_DOMAINS: snackup.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.39.4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare ephemeral credentials
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              for name in ['POSTGRES_PASSWORD', 'SNACKUP_DB_PASSWORD', 'SNACKUP_SECRET_KEY']:
                  value = secrets.token_hex(32)
                  print('::add-mask::' + value)
                  target.write(f'{name}={value}\n')
          PY
          mkdir -p reports/unified
      - name: Validate exactly one application container plus PostgreSQL
        run: |
          docker compose --env-file /dev/null config --quiet
          python - <<'PY'
          import json, subprocess
          config = json.loads(subprocess.check_output(['docker', 'compose', '--env-file', '/dev/null', 'config', '--format', 'json']))
          assert set(config['services']) == {'app', 'db'}
          assert not config['services']['db'].get('ports')
          ports = config['services']['app']['ports']
          assert len(ports) == 1 and ports[0]['host_ip'] == '127.0.0.1'
          assert str(ports[0]['published']) == '18080'
          env = config['services']['app']['environment']
          assert env['SNACKUP_REDIS_URL'].startswith('unix:///')
          assert env['SNACKUP_PASSWORD_RESET_FRONTEND_PATH'] == '/paneles/'
          assert env['SNACKUP_STUDENT_PASSWORD_RESET_FRONTEND_PATH'] == '/'
          assert env['SNACKUP_PUBLIC_ORIGIN'] == 'https://snackup.example.test'
          PY
      - name: Build the server and both REST clients from this checkout
        run: docker compose --env-file /dev/null build app
      - name: Verify Linux supervisor shutdown inside the release image
        run: |
          docker run --rm --read-only --tmpfs /tmp --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount "type=bind,source=$PWD/tests/test_unified_deploy.py,target=/app/tests/test_unified_deploy.py,readonly" \
            --entrypoint python snackup-unified:local -m pytest -q --noconftest -p no:cacheprovider \
            tests/test_unified_deploy.py::test_failed_child_is_detected_and_remaining_processes_are_stopped \
            tests/test_unified_deploy.py::test_readiness_wait_observes_stop_signal
      - name: Start all components and run HTTP and Socket.IO smoke
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' snackup-unified:local)" = '10001:10001'
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --entrypoint caddy snackup-unified:local version
          docker compose --env-file /dev/null up -d --no-build --wait --wait-timeout 180
          python - <<'PY'
          from pathlib import Path
          pinned = [line for line in Path('requirements.lock').read_text().splitlines() if line.startswith('websockets==')]
          assert len(pinned) == 1
          Path('reports/unified/smoke-requirements.txt').write_text(pinned[0] + '\n')
          PY
          python -m pip install -r reports/unified/smoke-requirements.txt
          python deploy/smoke_apps.py --integrated --report reports/unified/smoke.json
      - name: Check both sign-in screens in Chromium and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/snackup-browsers" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/snackup-browsers/node_modules/.bin/playwright" install --with-deps chromium webkit
          export SNACKUP_PLAYWRIGHT="$RUNNER_TEMP/snackup-browsers/node_modules/playwright"
          # Use the real configured HTTPS origin so cookies and API-origin checks behave as deployed.
          echo '127.0.0.1 snackup.example.test' | sudo tee -a /etc/hosts >/dev/null
          gateway="${COMPOSE_PROJECT_NAME}-browser-tls"
          docker run --detach --name "$gateway" --network "${COMPOSE_PROJECT_NAME}_edge" \
            --publish 127.0.0.1:443:8443 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --env XDG_DATA_HOME=/tmp/caddy-data \
            --entrypoint caddy snackup-unified:local reverse-proxy --from https://snackup.example.test:8443 \
            --to http://app:8080 --internal-certs --disable-redirects
          trap 'docker rm -f "$gateway" >/dev/null' EXIT
          curl --noproxy '*' --fail --silent --show-error --insecure --retry 15 --retry-all-errors \
            --retry-delay 1 https://snackup.example.test/health/ready >/dev/null
          node deploy/smoke_browsers.cjs reports/unified/browsers.json
      - name: Verify a child failure restarts the complete application
        run: |
          docker compose --env-file /dev/null exec -T app redis-cli -s /tmp/snackup-redis.sock SHUTDOWN
          python - <<'PY'
          import json, subprocess, time
          container = subprocess.check_output(['docker', 'compose', 'ps', '--all', '-q', 'app'], text=True).strip()
          for attempt in range(90):
              state = json.loads(subprocess.check_output(['docker', 'inspect', container]))[0]
              if state['RestartCount'] >= 1 and state['State'].get('Health', {}).get('Status') == 'healthy':
                  break
              time.sleep(1)
          else:
              raise SystemExit('Application did not recover after Redis stopped')
          PY
          python deploy/smoke_apps.py --integrated --report reports/unified/smoke-after-restart.json
      - name: Collect redacted diagnostics
        if: always()
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          target = Path('reports/unified')
          target.mkdir(parents=True, exist_ok=True)
          for filename, tail in [('status.txt', ['ps', '--all']), ('containers.log', ['logs', '--no-color', '--tail', '150'])]:
              result = subprocess.run(['docker', 'compose', '--env-file', '/dev/null', *tail], capture_output=True, text=True)
              output = result.stdout + result.stderr
              for name in ['POSTGRES_PASSWORD', 'SNACKUP_DB_PASSWORD', 'SNACKUP_SECRET_KEY']:
                  if os.environ.get(name):
                      output = output.replace(os.environ[name], '[REDACTED]')
              (target / filename).write_text(output)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/reports/unified
      - name: Remove only this disposable CI project
        if: always()
        run: docker compose --env-file /dev/null down --volumes --remove-orphans
