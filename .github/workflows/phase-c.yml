name: Phase C load and stress regression
on:
  push:
    branches: [codex/auditoria-v32-contenedor-unico]
    paths: ['backend/**', '.github/workflows/phase-c.yml']
permissions:
  contents: read
concurrency:
  group: phase-c-${{ github.ref }}
  cancel-in-progress: true
jobs:
  load:
    strategy:
      fail-fast: false
      matrix:
        profile: [base, pessimistic]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: backend
    env:
      COMPOSE_PROJECT_NAME: snackup-phase-c-${{ github.run_id }}-${{ matrix.profile }}
      SNACKUP_ENVIRONMENT: test
      SNACKUP_SECRET_KEY: isolated-phase-c-secret-not-for-production-2026
      SNACKUP_DATABASE_URL: postgresql+psycopg://loadtest:isolated-loadtest-password@127.0.0.1:15432/snackup_loadtest
      ALLOW_LOAD: 'YES'
      PROFILE: ${{ matrix.profile }}
      QUICK: ${{ contains(github.event.head_commit.message, '[phase-c-full]') && '--full' || '--quick' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: docker/setup-compose-action@v2
      - name: Configure isolated resource profile
        run: |
          mkdir -p reports/phase-c
          if [ "$PROFILE" = base ]; then
            echo 'SERVER_CPUS=0-3' >> "$GITHUB_ENV"
            echo 'WORKERS=3' >> "$GITHUB_ENV"
            echo 'DB_MEMORY=2g' >> "$GITHUB_ENV"
            echo 'APP_MEMORY=5g' >> "$GITHUB_ENV"
          else
            echo 'SERVER_CPUS=0-1' >> "$GITHUB_ENV"
            echo 'PASSWORD_CONCURRENCY=2' >> "$GITHUB_ENV"
            echo 'WORKERS=1' >> "$GITHUB_ENV"
            echo 'DB_MEMORY=1g' >> "$GITHUB_ENV"
            echo 'APP_MEMORY=2300m' >> "$GITHUB_ENV"
          fi
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          Path('reports/phase-c/environment.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'profile':os.environ['PROFILE'],'runnerCpu':os.cpu_count(),'platform':platform.platform(),'generatorSharesRunner':True,'serverCpu':4 if os.environ['PROFILE']=='base' else 2,'postgres':'17-alpine','fixtureStudents':1000,'businesses':4,'quick':os.environ['QUICK']=='--quick'},indent=2))
          PY
      - name: Build and start actual supervisor proxy API jobs Redis and PostgreSQL
        run: |
          python -m pip install -q -r requirements.lock
          docker compose -f load/phase_c/compose.yaml up -d --build --wait --wait-timeout 180
          python -m load.create_fixtures --confirm-isolated --output /tmp/phase-c-fixtures.json
      - name: Calibrate Argon2 without changing security parameters
        run: |
          docker compose -f load/phase_c/compose.yaml exec -T app python - <<'PYCODE' > reports/phase-c/calibration.json
          from concurrent.futures import ThreadPoolExecutor
          import json,time
          from snackup.auth import PASSWORDS
          encoded=PASSWORDS.hash('synthetic-calibration-password')
          results=[]
          for concurrency in (1,2,4):
              start=time.perf_counter()
              with ThreadPoolExecutor(max_workers=concurrency) as pool:
                  list(pool.map(lambda _:PASSWORDS.verify(encoded,'synthetic-calibration-password'),range(40)))
              results.append({'concurrency':concurrency,'verifications':40,'elapsedSeconds':time.perf_counter()-start})
          print(json.dumps({'argon2':{'memoryKiB':19456,'timeCost':2,'parallelism':1},'measurements':results},indent=2))
          PYCODE
      - name: P0 smoke and idempotent retry
        continue-on-error: true
        if: matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P0 --output reports/phase-c/P0.json $QUICK
      - name: P5 200 buyers finite stock 50
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P5 --output reports/phase-c/P5.json $QUICK
      - name: P6 50 keys and 10 simultaneous retries
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P6 --output reports/phase-c/P6.json $QUICK
      - name: P7b three waves of 200 logins
        continue-on-error: true
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P7b --output reports/phase-c/P7b.json $QUICK
      - name: P4 one business 2 to 40 orders per second
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P4 --output reports/phase-c/P4.json $QUICK
      - name: P2 reading steps to 1000 base or 300 pessimistic
        continue-on-error: true
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P2 --output reports/phase-c/P2.json $QUICK
      - name: P7 sustained 20 logins per second
        continue-on-error: true
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P7 --output reports/phase-c/P7.json $QUICK
      - name: P8 300 Socket.IO clients through Caddy
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P8 --output reports/phase-c/P8.json $QUICK
      - name: P8 1000 Socket.IO clients through Caddy
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P8-1000 --output reports/phase-c/P8-1000.json $QUICK
      - name: P8 randomized 20 to 40 seconds of silence
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P8-idle --output reports/phase-c/P8-idle.json $QUICK
      - name: P9 complete kitchen workflow 90 orders per minute
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P9 --output reports/phase-c/P9.json $QUICK
      - name: P9 burst 270 orders per minute
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P9-burst --output reports/phase-c/P9-burst.json $QUICK
      - name: P8b combined kitchen and 300 sockets
        continue-on-error: true
        if: success() && matrix.profile == 'base'
        run: python -m load.phase_c.runner --fixtures /tmp/phase-c-fixtures.json --profile "$PROFILE" --scenario P8b --output reports/phase-c/P8b.json $QUICK
      - name: Verify every required scenario produced a passing report
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          required=['P2','P7','P7b'] if os.environ['PROFILE']=='pessimistic' else ['P0','P2','P4','P5','P6','P7','P7b','P8','P8-1000','P8-idle','P8b','P9','P9-burst']
          for name in required:
              report=json.loads(Path('reports/phase-c/'+name+'.json').read_text())
              assert report['success'], (name,report['failures'])
          PYCODE
      - name: Collect bounded redacted diagnostics
        if: always()
        run: |
          docker compose -f load/phase_c/compose.yaml ps --all > reports/phase-c/status.txt
          docker compose -f load/phase_c/compose.yaml logs --no-color --tail 150 > reports/phase-c/containers.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-c-${{ matrix.profile }}-${{ github.run_id }}
          path: backend/reports/phase-c
          retention-days: 30
      - name: Remove only disposable load project
        if: always()
        run: docker compose -f load/phase_c/compose.yaml down --volumes --remove-orphans
