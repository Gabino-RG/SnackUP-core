name: Entrega de paneles REST

on:
  workflow_dispatch:
  push:
    branches: [codex/entrega-paneles-rest]
  pull_request:
    paths:
      - 'app/**'
      - 'docs/integracion/**'
      - 'scripts/integration/**'
      - 'scripts/review/**'
      - 'deploy/**'
      - '.github/workflows/paneles-entrega.yml'

permissions:
  contents: read

jobs:
  backend-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SNACKUP_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:isolated-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 81c76c5eda9ba6315fbf1dcd1a69599f8906db5e
          path: build/backend-v32
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned backend and browser
        run: |
          python -m pip install -r build/backend-v32/backend/requirements.lock
          npm install --prefix "$RUNNER_TEMP/snackup-ui" --no-package-lock --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/snackup-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compile the actual portal under its deployment path
        working-directory: app
        run: flutter build web --release --target lib/main_portal_api.dart --base-href /paneles/ --pwa-strategy=none --no-web-resources-cdn
      - name: Exercise Flutter clients and compiled screens against FastAPI V3.2
        run: |
          export SNACKUP_PLAYWRIGHT="$RUNNER_TEMP/snackup-ui/node_modules/playwright"
          python scripts/integration/live_backend.py --backend build/backend-v32/backend --web app/build/web --resilience
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SnackUP-Paneles-Backend-V32
          path: build/live-backend/
          if-no-files-found: ignore
          retention-days: 30
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate contract and local fixture
        run: |
          python -m unittest discover -s deploy -p test_check_panels_server.py
          python -m pip install -r scripts/integration/requirements.txt
          python scripts/integration/check_contract.py --review --report build/delivery/contract-report.json
      - name: Flutter tests and analysis
        working-directory: app
        run: |
          flutter config --enable-web --no-enable-linux-desktop --no-enable-windows-desktop --no-enable-macos-desktop
          flutter pub get
          flutter test --reporter expanded
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build exact-commit delivery
        run: |
          git status --short
          python scripts/integration/build_delivery.py
      - name: Install test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/snackup-ui" --no-package-lock --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/snackup-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise production frontend with disposable local fixture
        env:
          SNACKUP_PRODUCTION_BUILD: '1'
          SNACKUP_SCREENSHOTS: build/delivery/browser
          SNACKUP_API_PREFIX: /api/legacy/v1/
        run: |
          python scripts/review/review_server.py --no-browser --api-prefix /api/legacy/v1/ --web app/build/portal-entrega --data "$RUNNER_TEMP/snackup-delivery-data" > "$RUNNER_TEMP/snackup-delivery.log" 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8791/api/legacy/v1/auth/options > /dev/null; then break; fi
            sleep 1
          done
          export SNACKUP_PLAYWRIGHT="$RUNNER_TEMP/snackup-ui/node_modules/playwright"
          node scripts/review/browser_smoke.cjs
          python scripts/integration/check_contract.py --trace build/delivery/browser/contract-trace.json --report build/delivery/browser-contract-report.json
      - name: Preserve verified deliverable
        uses: actions/upload-artifact@v4
        with:
          name: SnackUP-Paneles-Frontend
          path: build/delivery/SnackUP-Paneles-Frontend.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SnackUP-Paneles-Validacion
          path: |
            build/delivery/*report.json
            build/delivery/browser/*.png
            build/delivery/browser/result.json
            build/delivery/browser/failure.txt
          if-no-files-found: ignore
          retention-days: 30
