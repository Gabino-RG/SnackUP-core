# SonarQube Cloud analysis for SnackUP Flutter/Dart.
# SONAR_ORGANIZATION and SONAR_PROJECT_KEY are injected by GitHub Actions
# from repository variables after the SonarQube Cloud project is imported.
sonar.projectName=SnackUP Flutter
sonar.sourceEncoding=UTF-8
sonar.sources=lib
sonar.tests=test
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/firebase_options.dart
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
