# Requiere un proyecto SonarQube con analizador Dart y soporte de PR.
# El servidor administrado de Google/Firebase no forma parte del analisis.
sonar.projectKey=snackup-flutter
sonar.projectName=SnackUP Flutter
sonar.sourceEncoding=UTF-8
sonar.sources=lib
sonar.tests=test
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/firebase_options.dart
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
