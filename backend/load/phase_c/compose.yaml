services:
  db:
    image: postgres:17-alpine
    cpuset: ${SERVER_CPUS:-0-3}
    mem_limit: ${DB_MEMORY:-2g}
    command: [postgres, -c, statement_timeout=20000, -c, lock_timeout=5000]
    environment:
      POSTGRES_DB: snackup_loadtest
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: isolated-loadtest-password
    ports: ['127.0.0.1:15432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loadtest -d snackup_loadtest']
      interval: 3s
      timeout: 2s
      retries: 20
  app:
    build:
      context: ../..
      dockerfile: load/phase_c/Dockerfile
    cpuset: ${SERVER_CPUS:-0-3}
    mem_limit: ${APP_MEMORY:-5g}
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      db: {condition: service_healthy}
    environment:
      SNACKUP_ENVIRONMENT: test
      SNACKUP_DATABASE_URL: postgresql+psycopg://loadtest:isolated-loadtest-password@db:5432/snackup_loadtest
      SNACKUP_SECRET_KEY: isolated-phase-c-secret-not-for-production-2026
      SNACKUP_PUBLIC_ORIGIN: http://127.0.0.1:18080
      SNACKUP_WORKERS: ${WORKERS:-3}
      SNACKUP_PASSWORD_CONCURRENCY: ${PASSWORD_CONCURRENCY:-4}
      SNACKUP_POOL_SIZE: 10
      SNACKUP_MAX_OVERFLOW: 5
      SNACKUP_ACCESS_TOKEN_MINUTES: 15
      SNACKUP_ADMIN_EMAIL_DOMAINS: load.snackup.invalid
      SNACKUP_STUDENT_EMAIL_DOMAINS: load.snackup.invalid
      SNACKUP_PUSH_ENABLED: 'false'
    ports: ['127.0.0.1:18080:8080']
    logging:
      options: {max-size: 10m, max-file: '2'}
