<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SnackUP: comida, pedidos y valoraciones en el campus">
  <meta name="theme-color" content="#062B50">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SnackUP">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.ico">
  <title>SnackUP · Campus Dining</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f7f8fa;color:#062b50;font-family:system-ui,sans-serif}
    #loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px}
    #loading strong{font-size:36px} #loading span{color:#269dc1}
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>Snack<span>UP</span></strong><span>Preparando tu próxima comida…</span></div>
  <noscript>Activa JavaScript para abrir SnackUP.</noscript>
  <script>
    window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());
    // Retire only an old Flutter worker registered for this app's own scope.
    // API responses and private sessions must never be served from a cache.
    async function startSnackUP(){
      if('serviceWorker' in navigator){
        const scope=new URL(document.baseURI).pathname;
        const registrations=await navigator.serviceWorker.getRegistrations();
        for(const registration of registrations){
          const worker=registration.active || registration.waiting;
          if(new URL(registration.scope).pathname===scope && worker?.scriptURL.endsWith('/flutter_service_worker.js')){
            if(await registration.unregister()){location.reload();return;}
          }
        }
      }
      const bootstrap=document.createElement('script');bootstrap.src='flutter_bootstrap.js';bootstrap.async=true;document.body.append(bootstrap);
    }
    startSnackUP().catch(()=>{document.getElementById('loading').textContent='No se pudo iniciar la app. Actualiza la página.';});
  </script>
</body>
</html>
