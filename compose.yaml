name: snackup-usuarios
services:
  usuarios:
    image: snackup-usuarios:local
    build:
      context: .
      args:
        WEB_BASE_HREF: ${WEB_BASE_HREF:-/}
    environment:
      SNACKUP_API_UPSTREAM: ${SNACKUP_API_UPSTREAM:-}
    ports:
      - '${SNACKUP_BIND_ADDRESS:-127.0.0.1}:${SNACKUP_USUARIOS_PORT:-8081}:8080'
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
